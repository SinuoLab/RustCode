name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Branch protection: main is the upstream mirror only.
  # Upstream sync (atomgit_atomcode/atomcode) is the ONLY allowed source of change;
  # fork-authored commits (e.g. `git merge dev`) must never land on main.
  # This job verifies that main has no commits outside the upstream branch history.
  branch-protection:
    name: main upstream-only protection
    runs-on: ubuntu-latest
    # Canonical-repo only. This job and `release-gate` below guard the GitCode
    # release flow; on the GitHub mirror (`github.repository` differs) they are
    # meaningless and must be skipped rather than run red.
    if: github.repository == 'SecLab/RustCode' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main has no commits outside upstream/main
        run: |
          # Upstream sync target is fixed; the fork's own remote is `origin`.
          git remote add upstream https://gitcode.com/atomgit_atomcode/atomcode
          git fetch upstream main --no-tags
          # main must equal upstream/main or be behind it (no fork-authored commits)
          ahead=$(git rev-list --count upstream/main..HEAD)
          if [ "$ahead" -gt 0 ]; then
            echo "::error::main branch has $ahead commit(s) not in upstream/main -- main only accepts upstream sync"
            echo ""
            echo "main is an upstream mirror; merging dev into it is prohibited."
            echo "To fix: move these commits to dev, then reset main to upstream:"
            echo "  git checkout dev && git cherry-pick <commit-sha>"
            echo "  git push origin dev"
            echo "  git fetch upstream main --no-tags"
            echo "  git checkout main && git reset --hard upstream/main"
            echo "  git push origin main --force   # one-off correction only"
            exit 1
          fi
          echo "[OK] main has no commits outside upstream/main"

  release-gate:
    name: release artifact gate
    runs-on: ubuntu-latest
    # dev only, deliberately. main is an upstream mirror and must never receive a
    # fork-authored change -- including an artifact-only one -- so this gate is
    # never widened to main. Sync path stays: upstream/main -> main only.
    # Gated to the canonical repo: on the GitHub mirror dev never carries a
    # release artifact, so this job would always fail -- skip it there.
    if: github.repository == 'SecLab/RustCode' && github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Guard rail: if someone later widens the `if` above, fail loudly instead of
      # letting this job silently run against main.
      - name: Assert this job never runs against main
        run: |
          if [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
            echo "::error::release-gate must never run on main (main is an upstream mirror)"
            exit 1
          fi
      # Same predicate as the local pre-push hook, so `git push --no-verify`
      # cannot land an artifact-less commit on dev either. `--target any`
      # because the runner is not the host that pushed (see the script header).
      - name: Verify a committed release artifact exists for this version
        run: bash scripts/prepush-release-check.sh --sha "$GITHUB_SHA" --target any

  release-pointers:
    name: release version pointers
    runs-on: ubuntu-latest
    # Deliberately NOT narrowed to the canonical repo, unlike release-gate above:
    # that job needs committed binaries (which only exist on GitCode), while this
    # one is pure JSON + git and therefore DOES run on the GitHub mirror -- the
    # only place CI actually executes. It is what catches "Cargo.toml says
    # v6.2.3, index.json/latest.json still say v6.2.1", the drift that shipped
    # v6.2.3 with a fallback and a self-update pointing at a release that had
    # no binaries at all.
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test the release scripts
        run: |
          bash scripts/release-check-pointers.sh --self-test
          bash scripts/release-publish.sh --self-test
          bash scripts/prepush-release-check.sh --self-test
      - name: Cargo.toml, release/index.json and latest.json must agree
        run: bash scripts/release-check-pointers.sh --sha "$GITHUB_SHA"
      # Cross-checks the tree against the GitCode releases API. Non-blocking on
      # purpose: a network hiccup or a lagging API must not turn CI red, but the
      # drift it reports must stay visible in the log.
      - name: Online cross-check against GitCode releases
        continue-on-error: true
        run: bash scripts/release-check-pointers.sh --sha "$GITHUB_SHA" --online

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    # Report-only: CI runner port binds cause flaky false-reds (run 37907335105
    # failed on first attempt, passed on rerun). A red here is usually an
    # environment false-negative, not a regression. Promote to a hard gate only
    # after port isolation is proven stable on the Linux runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Peak memory during a workspace test build is dominated by LINKING the
      # big binaries (rustcode / rustcode-daemon / rustcode-coding / rustcode-tuix),
      # not by compiling the small crates. Dropping debug info for those four
      # cuts the linker's working set (and the artifact size) several-fold while
      # keeping full debug symbols for every library crate -- a panic backtrace
      # in rustcode-config still resolves to a line. CARGO_PROFILE_* env vars
      # keep this out of Cargo.toml, so no source change is needed to toggle it.
      - name: run workspace tests (allowlist-guarded, debug symbols off for the big bins)
        env:
          CARGO_PROFILE_DEV_PACKAGE_rustcode_DEBUG: 0
          CARGO_PROFILE_DEV_PACKAGE_rustcode_daemon_DEBUG: 0
          CARGO_PROFILE_DEV_PACKAGE_rustcode_coding_DEBUG: 0
          CARGO_PROFILE_DEV_PACKAGE_rustcode_tuix_DEBUG: 0
        run: |
          set +e
          cargo test --workspace --no-fail-fast > /tmp/cargo-test.log 2>&1
          cargo_status=$?
          set -e
          cat /tmp/cargo-test.log
          if [ "$cargo_status" -eq 0 ]; then
            echo "[OK] all workspace tests passed; allowlist not needed"
            exit 0
          fi
          # Collect failing test names from the `failures:` summary blocks.
          failed=$(awk '/^failures:$/{f=1;next} /^test result:/{f=0} f&&/^    [A-Za-z_]/{print $1}' /tmp/cargo-test.log | sort -u)
          if [ -z "$failed" ]; then
            echo "::error::cargo test exited $cargo_status but no failing test name could be parsed; treating as a real regression"
            exit 1
          fi
          echo "--- failing tests ---"
          echo "$failed"
          unexpected=""
          for name in $failed; do
            case " $KNOWN_RED_TESTS " in
              *" $name "*) echo "[known-red] $name" ;;
              *) unexpected="$unexpected $name" ;;
            esac
          done
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected test failure(s):$unexpected -- this is a regression"
            exit 1
          fi
          echo "[OK] only known-red test(s) failed; job passes"

  # G6: Zero telemetry SDK check -- ensures no Sentry/PostHog/Segment/GA/etc.
  # tracking SDKs are introduced into the codebase (see AGENTS.md OBJECTIVE-2).
  no-telemetry:
    name: G6 - no telemetry SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for telemetry SDKs in Rust source
        run: |
          # Match telemetry SDK names precisely, avoiding false positives from
          # common words like "segment" (path segment) or "amplitude" (audio).
          # - sentry: SDK crate/dependency, not the English word
          # - posthog, mixpanel: unambiguous product names
          # - @segment/analytics or segment.io: the analytics SDK, not "segment"
          # - google-analytics, googletagmanager, gtag: GA family
          hits=$(grep -riE "sentry_(crash|event|init)|posthog|@segment/analytics|segment\.io|google-analytics|googletagmanager|gtag\(|mixpanel|amplitude_(init|track|log)" \
              --include="*.rs" --include="*.toml" crates/ || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Telemetry SDK reference found in Rust source or Cargo.toml"
            exit 1
          fi
          echo "[OK] no telemetry SDK references in Rust source"
      - name: Check for telemetry SDKs in package.json
        run: |
          for f in $(find . -name "package.json" -not -path "*/node_modules/*"); do
            if grep -qE '"(sentry|posthog|@segment/analytics|mixpanel|amplitude|@amplitude)"' "$f"; then
              echo "::error::Telemetry SDK dependency found in $f"
              exit 1
            fi
          done
          echo "[OK] no telemetry SDK dependencies in package.json files"

  # G4: Headless smoke test -- drives `rustcode -p` in offline mode.
  # Requires a debug build of the CLI binary. Network-dependent tests are
  # skipped when RUSTCODE_TEST_PROVIDER is unset (default in CI).
  headless-smoke:
    name: G4 - headless smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI binary
        run: cargo build -p rustcode
      - name: Run headless smoke tests
        run: ./scripts/test-headless.sh

  # G5: ACP stdio smoke test -- drives `rustcode acp` over stdin/stdout.
  # Uses the same debug binary built above. Hermetic: fresh RUSTCODE_HOME.
  acp-smoke:
    name: G5 - ACP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI binary
        run: cargo build -p rustcode
      - name: Run ACP smoke test
        run: python3 scripts/acp_smoke.py

  # G7/G8: No stale atomcode naming -- ensures the rename to rustcode-* is complete
  # (see AGENTS.md OBJECTIVE-1). Historical references in docs describing the
  # retired core are exempt and must be verified manually.
  no-stale-naming:
    name: G7/G8 - no stale atomcode naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check crates/scripts for atomcode references
        run: |
          if grep -rni "atomcode" crates/ scripts/ --include="*.rs" --include="*.sh" --include="*.toml" --include="*.py"; then
            echo "::error::Stale 'atomcode' reference found in crates/scripts"
            exit 1
          fi
          echo "[OK] no stale atomcode references in crates/scripts"
      - name: Check docs/architecture.md for atomcode references
        run: |
          if grep -rni "atomcode" docs/architecture.md 2>/dev/null; then
            echo "::error::Stale 'atomcode' reference found in docs/architecture.md"
            exit 1
          fi
          echo "[OK] no stale atomcode references in docs/architecture.md"

  # Portability gate for the `curl | sh` distribution scripts. They run under
  # /bin/sh (dash on Debian/Ubuntu) with `set -eu`, so reading one uninitialised
  # variable aborts the installer with an opaque "parameter not set" -- the exact
  # failure class fixed in 6c0b0a91 (DOWNLOADED). A syntax check cannot see it,
  # hence the runtime smoke: assert the script fails CLOSED with a readable
  # error instead of crashing on nounset.
  shell-scripts:
    name: shell scripts - dash / nounset portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (sh / dash / bash)
        run: |
          set -eu
          for f in scripts/install.sh scripts/uninstall.sh; do
            sh -n "$f"
            echo "[OK] sh -n $f"
            if command -v dash >/dev/null 2>&1; then
              dash -n "$f"
              echo "[OK] dash -n $f"
            else
              echo "[skip] dash not installed"
            fi
            bash -n "$f"
            echo "[OK] bash -n $f"
          done
      - name: shellcheck (sh dialect; skipped when unavailable)
        run: |
          set -eu
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "[skip] shellcheck not installed"
            exit 0
          fi
          shellcheck -S warning --shell=sh scripts/install.sh scripts/uninstall.sh
          echo "[OK] shellcheck clean"
      - name: Runtime smoke - install.sh must fail closed, not nounset-crash
        run: |
          set -eu
          mkdir -p /tmp/rc-probe
          set +e
          env -i PATH="$PATH" HOME="$HOME" SHELL=/bin/sh \
            RUSTCODE_VERSION=v6.2.1 \
            RUSTCODE_RELEASE_LATEST_API= \
            RUSTCODE_RELEASE_BASE=http://127.0.0.1:1/nope \
            RUSTCODE_RELEASE_RAW_BASE=http://127.0.0.1:1/nope \
            RUSTCODE_RELEASE_GH_BASE= \
            RUSTCODE_PREFIX=/tmp/rc-probe \
            RUSTCODE_DOWNLOAD_TIMEOUT=5 \
            sh scripts/install.sh >/tmp/probe.log 2>&1
          code=$?
          set -e
          cat /tmp/probe.log
          if grep -q 'parameter not set' /tmp/probe.log; then
            echo "::error::install.sh aborted on an unset variable (nounset crash)"
            exit 1
          fi
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 on the unreachable-source path, got $code"
            exit 1
          fi
          echo "[OK] install.sh fails closed without a nounset crash"
